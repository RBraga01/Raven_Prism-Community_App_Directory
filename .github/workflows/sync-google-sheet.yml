name: Sync community directory to Google Sheets

on:
  push:
    branches: [main]
    paths:
      - 'data/apps.json'
      - 'scripts/**'
      - 'requirements-sheet-sync.txt'
      - 'requirements-sheet-sync.lock'
      - '.github/workflows/sync-google-sheet.yml'
  issues:
    types: [opened, edited, reopened, closed, labeled, unlabeled]
  # A completed read-only PR validation wakes the trusted default-branch
  # publisher. No PR artifacts, merge commit, source files or executable
  # content from the contributor are downloaded or executed here.
  workflow_run:
    workflows: ["Validate directory"]
    types: [completed]
  schedule:
    - cron: '19 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: community-directory-sheet-sync
  cancel-in-progress: false

jobs:
  sync:
    # Skip workflow_run events caused by push; push has its own trigger.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the trusted default branch only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (Node.js 24)
        with:
          python-version: '3.12'
      - name: Validate reviewed catalog
        run: python scripts/validate_catalog.py
      - name: Require Sheets authentication
        env:
          GOOGLE_SHEETS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}
        shell: bash
        run: |
          if [ -z "$GOOGLE_SHEETS_CREDENTIALS_JSON" ]; then
            echo "::error::Sheets sync cannot run: set GOOGLE_SHEETS_CREDENTIALS_JSON; see docs/SHEETS_SYNC.md"
            exit 1
          fi
      - name: Install reviewed dependency versions
        run: python -m pip install --require-hashes -r requirements-sheet-sync.lock
      - name: Sync approved Apps and numeric public suggestion IDs
        env:
          GOOGLE_SHEETS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/sync_google_sheet.py
